# =============================================================================
# EduNova_X — Render Blueprint (Infrastructure as Code)
# -----------------------------------------------------------------------------
# PRODUCTION ARCHITECTURE
#
#                        USER
#                         |
#                         v
#          Cloudflare Workers frontend  (THE ONLY frontend)
#          https://edunova-x.ranjitacharya13.workers.dev
#                         |
#                         |  HTTPS  (VITE_API_URL / VITE_SIGNAL_URL)
#                         v
#              Node.js / Express API  +  Socket.IO   [Render: edunova-api]
#                         |
#              +----------+-----------+
#              |                      |
#              v                      v
#        MongoDB Atlas         Python FastAPI AI   [Render: edunova-ai]
#                                (via AI_ENGINE_URL)
#
# NOTES
#   - There is NO Render static-site frontend. The frontend stays on Cloudflare.
#   - The API service also hosts Socket.IO signaling + live-class chat, so the
#     standalone `signaling/` service is NOT deployed by default. It remains in
#     the repo and can be deployed separately (see the commented block below)
#     if signaling ever needs to scale independently of the REST API.
#   - Every service reads PORT from Render and binds 0.0.0.0. No fixed ports.
#   - rootDir is set per service so `npm install` runs in the SAME directory as
#     the package.json that declares that service's dependencies. This is what
#     prevents "Cannot find module 'nodemailer'".
#   - Secrets use `sync: false` and must be set in the Render dashboard.
#     Never commit real values to this file.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1) edunova-api — Express REST API + Socket.IO signaling/chat
  #    rootDir: server  ->  build & start both run inside ./server
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-api
    runtime: node
    plan: free
    branch: main
    rootDir: server
    # `npm ci` installs EXACTLY what server/package-lock.json pins (including
    # nodemailer) and fails loudly if the lockfile and package.json disagree.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Pure in-process health endpoint; it does not depend on MongoDB, AI,
    # authentication, or frontend build artifacts.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      # ---- Secrets: set these in the Render dashboard -----------------------
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        # Render generates a strong value on first deploy.
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      # ---- Public configuration --------------------------------------------
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      # Public HTTPS URL of the edunova-ai service defined below.
      # Set manually AFTER the AI service's first deploy, using the exact URL
      # Render assigns it (Dashboard -> edunova-ai -> the .onrender.com URL).
      # Deliberately NOT auto-wired: Render's fromService/hostport yields an
      # INTERNAL host:port that is unavailable on the free plan and is not a
      # valid https:// origin.
      - key: AI_ENGINE_URL
        sync: false
      # Optional but recommended: set the same random value on both services.
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: AGENT_REQUEST_TIMEOUT
        value: "210000"
      - key: AGENT_STREAM_TIMEOUT_MS
        value: "240000"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AI_RATE_LIMIT_MAX_REQUESTS
        value: "20"
      # Cold-start resilience: on the free plan edunova-ai spins down when
      # idle, and Render answers with an HTML 503 while it wakes. The AI also
      # returns 503 LLM_MODEL_LOADING while the self-hosted GGUF weights are
      # being downloaded/loaded after a cold boot. The API retries those fast
      # failures on this schedule before surfacing an error, so the first
      # question after an idle period succeeds once the model finishes booting.
      # The window is sized for model download + load (~2-4 min worst case).
      - key: AI_UPSTREAM_RETRY_DELAYS_MS
        value: "3000,8000,15000,30000"
      - key: AI_UPSTREAM_RETRY_WINDOW_MS
        value: "240000"
      # Seeding demo accounts (teacher@edunova.com / student@edunova.com, password
      # "123456") is a security risk in production — anyone could log in as a
      # demo teacher. Keep this "false" for a live deployment; set "true" only
      # for throwaway test environments.
      - key: SEED_DEMO_USERS
        value: "false"

  # ---------------------------------------------------------------------------
  # 2) edunova-ai — FastAPI autonomous learning/research agent
  #    rootDir: ai_engine  ->  `main:app` resolves to ai_engine/main.py
  #
  #    SELF-HOSTED MODEL: the service runs a quantized GGUF model in-process
  #    via llama.cpp (no OpenAI/Groq/Gemini/Anthropic keys).
  #
  #    ---- SIZING (read before changing `plan`) --------------------------------
  #    Model:   Qwen2.5-0.5B-Instruct Q4_K_M  (379 MiB of weights, Apache-2.0)
  #    Memory:  ~380 MB weights + ~75 MB KV cache (ctx 4096) + ~150 MB compute
  #             buffers/allocator + ~130 MB Python/FastAPI  =>  ~700 MB RSS.
  #
  #    Render instance types:  Free 512 MB / 0.1 CPU  •  Starter 512 MB / 0.5 CPU
  #                            Standard 2 GB / 1 CPU  •  Pro 4 GB / 2 CPU
  #
  #    => The FREE and STARTER plans (512 MB) CANNOT run this model: the process
  #       is OOM-killed during load, and 0.1 CPU would need minutes per answer.
  #       STANDARD (2 GB / 1 CPU) is the MINIMUM required resource change and is
  #       what this blueprint requests. This is a real cost change ($25/mo) and
  #       is deliberate — the alternative is an AI that cannot start.
  #
  #    Staying on a 512 MB plan? Then you MUST also downgrade the model, e.g.
  #       plan: starter
  #       LOCAL_MODEL_REPO=bartowski/SmolLM2-360M-Instruct-GGUF
  #       LOCAL_MODEL_FILE=SmolLM2-360M-Instruct-Q4_K_M.gguf   (258 MiB, ~480 MB RSS)
  #       LOCAL_MODEL_CTX=2048
  #    Both files are in the verified catalogue in ai_engine/config.py, so their
  #    existence, size and sha256 are checked automatically.
  #
  #    PERSISTENT DISK: the weights are cached on the disk mounted below, so the
  #    380 MB download happens ONCE (first boot) instead of on every restart or
  #    deploy. Without a disk the model is re-downloaded on every cold start.
  #
  #    /health binds and answers immediately (status: live) and reports
  #    `modelReady` separately, so Render never kills the service while the
  #    weights download; chat returns 503 LLM_MODEL_LOADING until ready and
  #    edunova-api retries those on a backoff schedule.
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-ai
    runtime: python
    plan: standard
    branch: main
    rootDir: ai_engine
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render; binding 0.0.0.0 is required.
    # Exactly ONE uvicorn worker: llama.cpp holds the model in this process and
    # generation is single-flight. A second worker would double the RAM.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: edunova-model-cache
      mountPath: /var/data/models
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      # PyPI hosts llama-cpp-python sources only; the official prebuilt CPU
      # wheels are served from this extra index (avoids a slow C++ build).
      - key: PIP_EXTRA_INDEX_URL
        value: https://abetlen.github.io/llama-cpp-python/whl/cpu
      # ---- Self-hosted local model (the AI brain) ---------------------------
      - key: LLM_PROVIDER
        value: local
      # VERIFIED to exist at
      # https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/tree/main
      # (public, ungated, 397,808,192 bytes). The previous value
      # "Qwen2.5-0.5B-Instruct-IQ3_XXS.gguf" was never published in that repo,
      # which is exactly why model download failed with HTTP 404.
      - key: LOCAL_MODEL_REPO
        value: bartowski/Qwen2.5-0.5B-Instruct-GGUF
      - key: LOCAL_MODEL_FILE
        value: Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      # Weights cache on the persistent disk => downloaded once, not per deploy.
      - key: LOCAL_MODEL_DIR
        value: /var/data/models
      # Size + sha256 for this repo/file are pinned in ai_engine/config.py
      # (KNOWN_MODELS) and enforced automatically. Only set these when you point
      # LOCAL_MODEL_* at a file that is not in that catalogue:
      # - key: LOCAL_MODEL_SHA256
      #   sync: false
      # - key: LOCAL_MODEL_BYTES
      #   sync: false
      # Optional direct download URL (private mirror / pre-signed link):
      # - key: LOCAL_MODEL_URL
      #   sync: false
      - key: LOCAL_MODEL_CTX
        value: "4096"
      - key: LOCAL_MODEL_THREADS
        value: "2"
      - key: LOCAL_MODEL_BATCH
        value: "256"
      - key: LOCAL_MODEL_CHAT_FORMAT
        value: chatml
      - key: LOCAL_PRELOAD_MODEL
        value: "true"
      - key: LOCAL_CHAT_WAIT_TIMEOUT
        value: "25"
      - key: LOCAL_MODEL_DOWNLOAD_TIMEOUT
        value: "900"
      - key: LOCAL_MODEL_DOWNLOAD_RETRIES
        value: "3"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "384"
      - key: LLM_TEMPERATURE
        value: "0.2"
      # ---- Emergency rollback only (unused while LLM_PROVIDER=local) --------
      # Set LLM_PROVIDER=openai_compatible + LLM_API_KEY/LLM_MODEL/LLM_BASE_URL
      # in the dashboard to temporarily restore a hosted provider, then remove
      # once the local model is verified. Never commit a key here.
      # -----------------------------------------------------------------------
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: brave
      # Public HTTPS URL of edunova-api, required for real authenticated tools.
      - key: APP_BACKEND_URL
        sync: false
      # Required: same random value as on edunova-api.
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: AI_REQUIRE_INTERNAL_TOKEN
        value: "true"
      # ---- Bounded autonomous execution (tuned for shared CPU) --------------
      - key: MAX_AGENT_ITERATIONS
        value: "3"
      - key: MAX_TOOL_CALLS
        value: "8"
      - key: MAX_AGENT_RUNTIME_SECONDS
        value: "180"
      - key: WEB_SEARCH_MAX_RESULTS
        value: "3"
      - key: WEB_REQUEST_TIMEOUT
        value: "10"
      - key: WEB_MAX_CONTENT_LENGTH
        value: "200000"
      - key: WEB_MAX_EXTRACTED_CHARS
        value: "45000"
      # Must fit inside LOCAL_MODEL_CTX (~3 chars/token) together with the
      # system prompt and LLM_MAX_OUTPUT_TOKENS, or every data-rich turn gets
      # trimmed by the runtime context guard.
      - key: AGENT_MAX_CONTEXT_CHARS
        value: "12000"

  # ---------------------------------------------------------------------------
  # 3) edunova-signal — OPTIONAL standalone WebRTC signaling service.
  #    Disabled by default: server/server.js already provides Socket.IO
  #    signaling and chat on the API service. Uncomment ONLY if you want
  #    signaling isolated, and then point VITE_SIGNAL_URL at this service
  #    instead of the API service when building the frontend.
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: edunova-signal
  #   runtime: node
  #   plan: free
  #   rootDir: signaling
  #   buildCommand: npm ci --omit=dev
  #   startCommand: npm start
  #   healthCheckPath: /health
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "20.18.0"
  #     - key: CORS_ORIGIN
  #       value: https://edunova-x.ranjitacharya13.workers.dev
