# =============================================================================
# EduNova_X — Render Blueprint (Infrastructure as Code)
# -----------------------------------------------------------------------------
# PRODUCTION ARCHITECTURE
#
#                        USER
#                         |
#                         v
#          Cloudflare Workers frontend  (THE ONLY frontend)
#          https://edunova-x.ranjitacharya13.workers.dev
#                         |
#                         |  HTTPS  (VITE_API_URL / VITE_SIGNAL_URL)
#                         v
#              Node.js / Express API  +  Socket.IO   [Render: edunova-api]
#                         |
#              +----------+-----------+
#              |                      |
#              v                      v
#        MongoDB Atlas         Python FastAPI AI   [Render: edunova-ai]
#                                (via AI_ENGINE_URL)
#
# NOTES
#   - There is NO Render static-site frontend. The frontend stays on Cloudflare.
#   - The API service also hosts Socket.IO signaling + live-class chat, so the
#     standalone `signaling/` service is NOT deployed by default. It remains in
#     the repo and can be deployed separately (see the commented block below)
#     if signaling ever needs to scale independently of the REST API.
#   - Every service reads PORT from Render and binds 0.0.0.0. No fixed ports.
#   - rootDir is set per service so `npm install` runs in the SAME directory as
#     the package.json that declares that service's dependencies. This is what
#     prevents "Cannot find module 'nodemailer'".
#   - Secrets use `sync: false` and must be set in the Render dashboard.
#     Never commit real values to this file.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1) edunova-api — Express REST API + Socket.IO signaling/chat
  #    rootDir: server  ->  build & start both run inside ./server
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-api
    runtime: node
    plan: free
    branch: main
    rootDir: server
    # `npm ci` installs EXACTLY what server/package-lock.json pins (including
    # nodemailer) and fails loudly if the lockfile and package.json disagree.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Pure in-process health endpoint; it does not depend on MongoDB, AI,
    # authentication, or frontend build artifacts.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      # ---- Secrets: set these in the Render dashboard -----------------------
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        # Render generates a strong value on first deploy.
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      # ---- Public configuration --------------------------------------------
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      # Public HTTPS URL of the edunova-ai service defined below.
      # Set manually AFTER the AI service's first deploy, using the exact URL
      # Render assigns it (Dashboard -> edunova-ai -> the .onrender.com URL).
      # Deliberately NOT auto-wired: Render's fromService/hostport yields an
      # INTERNAL host:port that is unavailable on the free plan and is not a
      # valid https:// origin.
      - key: AI_ENGINE_URL
        sync: false
      # Optional but recommended: set the same random value on both services.
      - key: AI_INTERNAL_TOKEN
        sync: false
      # Network safety backstops only; neither value controls model output.
      # Streaming answers may run as long as tokens/keep-alives keep arriving.
      - key: AGENT_REQUEST_TIMEOUT
        value: "600000"
      - key: AGENT_STREAM_IDLE_TIMEOUT_MS
        value: "90000"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AI_RATE_LIMIT_MAX_REQUESTS
        value: "20"
      # Cold-start resilience: the model is downloaded/loaded at service
      # startup and warmed to READY (GET /api/ai/ready returns 200 only then).
      # Streaming /chat requests are queued at this gateway for up to
      # AI_WARM_QUEUE_MAX_MS — the student sees "EduNova AI is preparing…" and
      # their message is forwarded automatically once the model is ready, so a
      # cold boot never surfaces "please try again shortly".
      - key: AI_WARM_QUEUE_MAX_MS
        value: "600000"
      - key: AI_UPSTREAM_RETRY_DELAYS_MS
        value: "3000,8000,15000,30000"
      - key: AI_UPSTREAM_RETRY_WINDOW_MS
        value: "240000"
      # Seeding demo accounts (teacher@edunova.com / student@edunova.com, password
      # "123456") is a security risk in production — anyone could log in as a
      # demo teacher. Keep this "false" for a live deployment; set "true" only
      # for throwaway test environments.
      - key: SEED_DEMO_USERS
        value: "false"

  # ---------------------------------------------------------------------------
  # 2) edunova-ai — FastAPI autonomous learning/research agent
  #    rootDir: ai_engine  ->  `main:app` resolves to ai_engine/main.py
  #
  #    SELF-HOSTED MODEL: the service runs a quantized open-source PyTorch
  #    model in-process (torch.inference_mode + transformers, adaptive
  #    int8/bf16/fp32 via LOCAL_MODEL_DTYPE=auto). No OpenAI/Groq/Gemini/
  #    Anthropic/OpenRouter keys are used — the reasoning model is self-hosted.
  #
  #    ---- SIZING (read before changing `plan`) --------------------------------
  #    Model:   Qwen2.5-0.5B-Instruct  (~0.49B params, Apache-2.0)
  #    Runtime: PyTorch CPU + transformers + tokenizer (~0.9 GB baseline)
  #             + weights (int8 ≈ 0.5 GB / bf16 ≈ 1 GB) + KV cache.
  #
  #    Render instance types:  Free 512 MB / 0.1 CPU  •  Starter 512 MB / 0.5 CPU
  #                            Standard 2 GB / 1 CPU  •  Pro 4 GB / 2 CPU
  #
  #    => The FREE and STARTER plans (512 MB) CANNOT run a PyTorch runtime: the
  #       process is OOM-killed during load. STANDARD (2 GB / 1 CPU) is the
  #       MINIMUM; PRO (4 GB / 2 CPU) is recommended for headroom and lets you
  #       move up to Qwen2.5-1.5B-Instruct. Reported RAM required: >=2 GB
  #       (int8), ~4 GB recommended.
  #
  #    PERSISTENT DISK: the weights are cached on the disk mounted below, so
  #    the download happens ONCE (first boot) instead of on every restart or
  #    deploy — this is the cold-start strategy: disk-cached weights => warm
  #    boots skip the download entirely.
  #
  #    WARMING: /health binds immediately (status: live); the model is loaded
  #    and warmed in the background at startup. /api/ai/ready returns 200 only
  #    after load + warm-up inference. edunova-api queues streaming chat
  #    requests (AI_WARM_QUEUE_MAX_MS) while the model prepares — students see
  #    "EduNova AI is preparing…" and their message is answered automatically.
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-ai
    runtime: python
    plan: standard
    branch: main
    rootDir: ai_engine
    # CPU wheels for PyTorch are installed from the official CPU index BEFORE
    # requirements.txt so pip never resolves the default (CUDA, ~3GB) wheel.
    # (The legacy llama.cpp runtime is optional: ai_engine/requirements-llamacpp.txt.)
    buildCommand: pip install "torch>=2.2,<2.5" --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    # $PORT is injected by Render; binding 0.0.0.0 is required.
    # Exactly ONE uvicorn worker: the PyTorch model lives in this process and
    # generation is single-flight. A second worker would double the RAM.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    disk:
      # Model weights + HF cache live on the persistent disk => downloaded once
      # at first boot, not on every deploy/cold start (cold-start strategy).
      name: edunova-model-cache
      mountPath: /var/data/models
      sizeGB: 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      # ---- Self-hosted local model (the AI brain) ---------------------------
      - key: LLM_PROVIDER
        value: local
      - key: LOCAL_MODEL_RUNTIME
        value: torch
      # PyTorch-first runtime. Qwen2.5-0.5B-Instruct: Apache-2.0, ChatML +
      # tool-calling + multilingual (incl. Tamil/Hindi), 32k native context.
      # The model is downloaded ONCE at service startup (never during a user
      # request) and warmed to READY before /api/ai/ready returns 200.
      - key: LOCAL_MODEL_REPO
        value: Qwen/Qwen2.5-0.5B-Instruct
      # auto => adaptive compute picks int8/bf16/fp32 from real container RAM.
      - key: LOCAL_MODEL_DTYPE
        value: auto
      - key: LOCAL_MODEL_DEVICE
        value: auto
      # Weights + HF snapshot cache on the persistent disk.
      - key: LOCAL_MODEL_DIR
        value: /var/data/models
      - key: LOCAL_MODEL_CTX
        value: "6144"
      # 0 => adaptive thread count (min(4, allocated CPU cores)).
      - key: LOCAL_MODEL_THREADS
        value: "0"
      - key: LOCAL_PRELOAD_MODEL
        value: "true"
      # AI-service-side queue budget while the model warms. It never cuts an
      # answer; the API gateway holds streaming requests separately.
      - key: LOCAL_CHAT_WAIT_TIMEOUT
        value: "180"
      - key: LOCAL_MODEL_DOWNLOAD_TIMEOUT
        value: "1800"
      # RAG retrieval (semantic learning-material index; user-scoped).
      - key: RAG_ENABLED
        value: "true"
      # Optional transformer embedder id; falls back to the built-in lexical
      # embedder when unreachable. Leave empty for the default MiniLM id.
      # - key: RAG_EMBEDDING_MODEL
      #   value: sentence-transformers/all-MiniLM-L6-v2
      # Quality ceiling. The router adaptively selects 128–1800 tokens by task;
      # no elapsed-time logic reduces this budget during generation.
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: LLM_TEMPERATURE
        value: "0.2"
      # ---- Emergency rollback only (unused while LLM_PROVIDER=local) --------
      # Set LLM_PROVIDER=openai_compatible + LLM_API_KEY/LLM_MODEL/LLM_BASE_URL
      # in the dashboard to temporarily restore a hosted provider, then remove
      # once the local model is verified. Never commit a key here.
      # -----------------------------------------------------------------------
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: brave
      # Public HTTPS URL of edunova-api, required for real authenticated tools.
      - key: APP_BACKEND_URL
        sync: false
      # Required: same random value as on edunova-api.
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: AI_REQUIRE_INTERNAL_TOKEN
        value: "true"
      # ---- Bounded autonomous execution (tuned for shared CPU) --------------
      - key: MAX_AGENT_ITERATIONS
        value: "3"
      - key: MAX_TOOL_CALLS
        value: "8"
      # Retained for bounded autonomous-loop compatibility; model generation
      # itself is never stopped based on this performance target.
      - key: MAX_AGENT_RUNTIME_SECONDS
        value: "300"
      - key: WEB_SEARCH_MAX_RESULTS
        value: "3"
      - key: WEB_REQUEST_TIMEOUT
        value: "10"
      - key: WEB_MAX_CONTENT_LENGTH
        value: "200000"
      - key: WEB_MAX_EXTRACTED_CHARS
        value: "45000"
      # Must fit inside LOCAL_MODEL_CTX (~3 chars/token) together with the
      # system prompt and LLM_MAX_OUTPUT_TOKENS, or every data-rich turn gets
      # trimmed by the runtime context guard.
      - key: AGENT_MAX_CONTEXT_CHARS
        value: "12000"

  # ---------------------------------------------------------------------------
  # 3) edunova-signal — OPTIONAL standalone WebRTC signaling service.
  #    Disabled by default: server/server.js already provides Socket.IO
  #    signaling and chat on the API service. Uncomment ONLY if you want
  #    signaling isolated, and then point VITE_SIGNAL_URL at this service
  #    instead of the API service when building the frontend.
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: edunova-signal
  #   runtime: node
  #   plan: free
  #   rootDir: signaling
  #   buildCommand: npm ci --omit=dev
  #   startCommand: npm start
  #   healthCheckPath: /health
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "20.18.0"
  #     - key: CORS_ORIGIN
  #       value: https://edunova-x.ranjitacharya13.workers.dev
