# =============================================================================
# EduNova_X — Render Blueprint (Infrastructure as Code)
# -----------------------------------------------------------------------------
# Production architecture:
#   - Cloudflare Workers frontend: https://edunova-x.ranjitacharya13.workers.dev (ONLY frontend)
#   - Render backend services (this file defines only backends):
#       1. edunova-api      (Express API + Socket.IO)   rootDir: server
#       2. edunova-signal   (WebRTC signaling server)   rootDir: signaling
#       3. edunova-ai       (FastAPI AI engine)         rootDir: ai_engine
#
# Rules enforced:
#   - No Render static frontend service.
#   - All services read PORT from Render's env (no hardcoded ports).
#   - Bind to 0.0.0.0 (server.js and signaling do).
#   - Health checks: GET /health -> 200.
#   - CORS_ORIGIN explicitly allows Cloudflare Workers frontend.
#   - Localhost origins preserved only for local development via fallback logic in code.
#   - Secrets marked sync: false (set manually in Render Dashboard).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1) edunova-api — Express + Socket.IO backend + REST API
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      - key: AI_ENGINE_URL
        value: https://edunova-ai.onrender.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: SEED_DEMO_USERS
        value: "true"

  # ---------------------------------------------------------------------------
  # 2) edunova-signal — WebRTC / Socket.IO signaling
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-signal
    runtime: node
    rootDir: signaling
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev

  # ---------------------------------------------------------------------------
  # 3) edunova-ai — FastAPI AI engine
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-ai
    runtime: python
    rootDir: ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
