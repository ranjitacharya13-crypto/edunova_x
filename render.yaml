# =============================================================================
# EduNova_X — Render Blueprint (Infrastructure as Code)
# -----------------------------------------------------------------------------
# Defines the three backend web services:
#   1. edunova-api      (Express API + Socket.IO)   rootDir: ./server
#   2. edunova-signal   (WebRTC signaling server)   rootDir: ./signaling
#   3. edunova-ai       (FastAPI AI engine)         rootDir: ./ai_engine
#
# Every service:
#   - reads the port from $PORT (Render injects it — nothing is hardcoded),
#   - exposes GET /health -> 200 {"status":"ok","service":"edunova-x-production"}
#     (healthCheckPath below),
#   - runs on Node 20+ (.nvmrc / .node-version in each service root + the
#     NODE_VERSION env var below are belt-and-suspenders).
#
# NATIVE DEPENDENCIES (sharp / pdf-thumbnail):
#   edunova-api builds from server/Dockerfile (runtime: docker) because
#   pdf-thumbnail shells out to GraphicsMagick + Ghostscript, which Render's
#   native Node runtime does not ship. The Dockerfile installs them, and sharp
#   installs prebuilt libvips binaries via npm — thumbnails work end-to-end.
#   dockerfilePath/dockerContext are relative to the REPO ROOT (Render spec);
#   server/Dockerfile itself is written against the server/ build context.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1) edunova-api — Express + Socket.IO backend (Docker: sharp + pdf-thumbnail)
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: server
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: SEED_DEMO_USERS
        value: "true"
      - key: NODE_VERSION
        value: "20"
      # Comma-separated extra CORS origins (e.g. your custom domain). The
      # server already whitelists every *.vercel.app deployment, localhost and
      # ngrok — CORS_ORIGINS is only needed for additional domains.
      - key: CORS_ORIGINS
        sync: false
      - key: AI_ENGINE_URL
        fromService:
          name: edunova-ai
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # Render injects PORT automatically; the server reads process.env.PORT.
      # NOTE: do NOT add a hardcoded PORT here — it would shadow Render's value.

  # ---------------------------------------------------------------------------
  # 2) edunova-signal — WebRTC / Socket.IO signaling
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-signal
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: signaling
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

  # ---------------------------------------------------------------------------
  # 3) edunova-ai — FastAPI AI engine
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
