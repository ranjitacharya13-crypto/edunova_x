# =============================================================================
# EduNova_X — Render Blueprint (Infrastructure as Code)
# -----------------------------------------------------------------------------
# PRODUCTION ARCHITECTURE
#
#                        USER
#                         |
#                         v
#          Cloudflare Workers frontend  (THE ONLY frontend)
#          https://edunova-x.ranjitacharya13.workers.dev
#                         |
#                         |  HTTPS  (VITE_API_URL / VITE_SIGNAL_URL)
#                         v
#              Node.js / Express API  +  Socket.IO   [Render: edunova-api]
#                         |
#              +----------+-----------+
#              |                      |
#              v                      v
#        MongoDB Atlas      EduNova AI service  [Render: edunova-ai]
#          (via AI_ENGINE_URL)   IntentRouter + ToolRegistry + RAG + web
#                             research + memory + THE OWN MODEL loaded
#                             IN-PROCESS: one supervised llama.cpp worker
#                             (llama-cpp-python is an internal library —
#                             there is NO separate inference service to
#                             deploy, and no external LLM API anywhere).
#
# RAM BUDGET — RENDER FREE (512 MiB) ONLY; see each service block for derivation
#   edunova-api   Node/Express, no LLM                        ~150 MiB -> 512 MiB plan OK
#   edunova-ai    model 101 MiB + KV cache + llama.cpp runtime
#                 + FastAPI parent + supervised worker         ~460 MiB -> 512 MiB plan OK
#
# DO NOT "upgrade" anything here: the whole stack is sized for the FREE plan.
# No external LLM APIs (no OpenAI/Groq/Gemini/Anthropic/OpenRouter) anywhere —
# inference is 100% self-hosted llama.cpp/GGUF behind AI_INTERNAL_TOKEN auth.
#
# NOTES
#   - Blueprint auto-syncs from the main branch of this GitHub repository.
#   - There is NO Render static-site frontend. The frontend stays on Cloudflare.
#   - The API service also hosts Socket.IO signaling + live-class chat, so the
#     standalone `signaling/` service is NOT deployed by default. It remains in
#     the repo and can be deployed separately (see the commented block below)
#     if signaling ever needs to scale independently of the REST API.
#   - Every service reads PORT from Render and binds 0.0.0.0. No fixed ports.
#   - rootDir is set per service so `npm install` runs in the SAME directory as
#     the package.json that declares that service's dependencies. This is what
#     prevents "Cannot find module 'nodemailer'".
#   - Secrets use `sync: false` and must be set in the Render dashboard.
#     Never commit real values to this file.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1) edunova-api — Express REST API + Socket.IO signaling/chat
  #    rootDir: server  ->  build & start both run inside ./server
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-api
    runtime: node
    plan: free
    branch: main
    rootDir: server
    # `npm ci` installs EXACTLY what server/package-lock.json pins (including
    # nodemailer) and fails loudly if the lockfile and package.json disagree.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Pure in-process health endpoint; it does not depend on MongoDB, AI,
    # authentication, or frontend build artifacts.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      # ---- Secrets: set these in the Render dashboard -----------------------
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        # Render generates a strong value on first deploy.
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      # ---- Public configuration --------------------------------------------
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      # Public HTTPS URL of the edunova-ai service defined below. Auto-wired in
      # the Blueprint via fromService + RENDER_EXTERNAL_URL so Render resolves the
      # real public https://<service>.onrender.com URL at deploy time — no manual
      # copy/paste from the dashboard and no guessed hostname. Render deploys the
      # referenced service first and refreshes this value on each Blueprint sync.
      - key: AI_ENGINE_URL
        fromService:
          name: edunova-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional but recommended: set the same random value on both services.
      - key: AI_INTERNAL_TOKEN
        sync: false
      # Network safety backstops only; neither value controls model output.
      # Streaming answers may run as long as tokens/keep-alives keep arriving.
      - key: AGENT_REQUEST_TIMEOUT
        value: "600000"
      - key: AGENT_STREAM_IDLE_TIMEOUT_MS
        value: "90000"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AI_RATE_LIMIT_MAX_REQUESTS
        value: "20"
      # No warm queues and no replay of tool-bearing chat POSTs. Readiness is
      # observed once; the persistent AI service owns startup and hard deadlines.
      # Legacy throwaway accounts (teacher@edunova.com / student@edunova.com,
      # password "123456") are a security risk in production — anyone could log
      # in as a demo teacher. Keep this "false" for a live deployment; set
      # "true" only for throwaway test environments.
      - key: SEED_DEMO_USERS
        value: "false"
      # The demo STUDENT printed on the login card
      # (student@edunova.demo / Student@12345) is provisioned IDEMPOTENTLY on
      # every start by server/services/demoAccount.js — it is a REAL account, and
      # the "Login as Demo Student" button authenticates against it through
      # POST /api/auth/login. Keep this "true": without the record the demo
      # button can only ever answer 401, which is exactly the failure mode
      # ("Invalid credentials" + HTTP 400) this service was showing. The seeder
      # never duplicates the account, never creates admins/teachers, and never
      # overwrites an account that belongs to a real user.
      - key: SEED_DEMO_STUDENT
        value: "true"
      # OPTIONAL override of the demo password. It MUST match the password
      # shown on the login page (Student@12345), otherwise the demo login stops
      # working. Leave it unset unless you also change the UI.
      # - key: DEMO_STUDENT_PASSWORD
      #   sync: false

  # ---------------------------------------------------------------------------
  # 2) edunova-ai — EduNova AI: orchestrator + OWN IN-PROCESS MODEL.
  #    rootDir: ai_engine  ->  `main:app` resolves to ai_engine/main.py
  #
  #    This ONE service owns the complete AI stack: intent routing, the
  #    authenticated ToolRegistry, RAG orchestration, web search, conversation
  #    memory, SSE relay — and the self-hosted GGUF model itself, loaded into
  #    exactly one supervised worker spawned by this process
  #    (llama-cpp-python is an internal library, NOT an external service).
  #    History: the 0.5B-class model (Qwen2.5-0.5B, ~1100 MiB with runtime)
  #    forced a 3-service split; the 135M-class model fits the full stack in
  #    one 512 MiB container, so the split (and its AI_INFERENCE_URL wiring)
  #    is no longer part of the deployment.
  #
  #    SIZING: ~120–180 MiB RSS  =>  fits a 512 MiB plan with headroom.
  # ---------------------------------------------------------------------------
  - type: web
    name: edunova-ai
    runtime: python
    plan: free
    branch: main
    rootDir: ai_engine
    # The AI service OWNS its model: llama-cpp-python (internal library) +
    # the FastAPI orchestrator stack in one image. No separate inference
    # service exists in this topology. verify_runtime.py fails the BUILD if
    # `import llama_cpp` is broken, and re-verifies before the port binds.
    buildCommand: pip install -r requirements-inference-free.txt && python verify_runtime.py
    startCommand: python verify_runtime.py && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGIN
        value: https://edunova-x.ranjitacharya13.workers.dev
      - key: LLM_PROVIDER
        value: local
      # THE MODEL IS OWNED BY THIS SERVICE (in-process supervised runtime).
      # AI_INFERENCE_URL is deliberately NOT set: the orchestrator loads the
      # GGUF itself through inference/inprocess.py (single supervised worker).
      # Setting AI_INFERENCE_URL explicitly would switch to a split topology —
      # not used by this Blueprint.
      - key: LOCAL_MODEL_RUNTIME
        value: llama_cpp
      # VERIFIED catalogue entry (ai_engine/config.py -> KNOWN_MODELS): size +
      # sha256 integrity-pinned, ChatML. Downloaded once to the cache dir.
      # QuantFactory Q4_1 is the verified pin (sha256 b179c952…): it is also
      # reachable as a single LFS blob, which matters for cold-boot downloads.
      - key: LOCAL_MODEL_REPO
        value: QuantFactory/SmolLM2-135M-Instruct-GGUF
      - key: LOCAL_MODEL_FILE
        value: SmolLM2-135M-Instruct.Q4_1.gguf
      # ---------------------------------------------------------------------------
      # MODEL STORAGE — the 2026-09 MODEL_DOWNLOAD_FAILED root cause.
      #
      # The OLD value `/var/data/models` is NOT writable on Render's native
      # Python runtime: native services check out at /opt/render/project/src
      # and run without permission to create directories under /var, and a
      # persistent disk mounted at /var/data (the only thing that makes that
      # path writable) REQUIRES A PAID PLAN — the free plan in this Blueprint
      # cannot attach one. The runtime therefore failed `mkdir /var/data/models`
      # and (before the storage-validation stage existed) mis-reported it as a
      # generic MODEL_DOWNLOAD_FAILED.
      #
      # The FIX: a module-relative cache directory. `./models_cache` resolves
      # against the ai_engine package directory — on Render that is
      # /opt/render/project/src/ai_engine/models_cache, which IS writable at
      # runtime (it is the documented source-tree location for service files).
      # The supervisor now PROVES writability at startup (mkdir + write +
      # read + rename + delete probes + free-space check) before any download,
      # and fails fast with MODEL_STORAGE_NOT_WRITABLE (naming the exact path)
      # if LOCAL_MODEL_DIR is ever pointed somewhere unusable.
      #
      # FREE PLAN: the cache is instance-local and lives for the lifetime of
      # the running instance — the model is downloaded once per cold boot and
      # then cached (size + sha256 verified, never re-downloaded while the
      # instance lives).
      #
      # PAID-PLAN UPGRADE (persistent disk, survives deploys/restarts):
      #   1. Attach a disk, e.g.:
      #        disk:
      #          name: edunova-models
      #          mountPath: /var/data/models
      #          sizeGB: 1
      #   2. Set LOCAL_MODEL_DIR: /var/data/models (the disk mount path).
      # Disks require a paid plan and pin the service to a single instance.
      - key: LOCAL_MODEL_DIR
        value: ./models_cache
      - key: LOCAL_MODEL_THREADS
        value: "1"
      # 0.1 shared vCPU + a ~100 MB cold-boot download: give startup room.
      - key: MODEL_STARTUP_TIMEOUT
        value: "900"
      - key: MODEL_INFERENCE_IDLE_TIMEOUT
        value: "120"
      - key: LOCAL_MODEL_DOWNLOAD_TIMEOUT
        value: "1800"
      # (AI_INFERENCE_REQUEST_TIMEOUT is intentionally not set: it only applies
      # to the split topology's network hop, which this Blueprint never uses —
      # the model is owned in-process.)
      # RAG is DISABLED on the Free architecture: no PyTorch embedding model
      # is loaded (lexical embeddings stay available). The RAG architecture is
      # intact — on a >= 1 GB instance set RAG_ENABLED=true here (with
      # RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2).
      - key: RAG_ENABLED
        value: "false"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: auto
      # Public HTTPS URL of edunova-api, required for real authenticated tools.
      # Auto-wired via fromService + RENDER_EXTERNAL_URL so the orchestrator can
      # reach edunova-api's public URL for authenticated ToolRegistry calls —
      # no manual value and no guessed hostname.
      - key: APP_BACKEND_URL
        fromService:
          name: edunova-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Required: same random value on edunova-api and edunova-ai.
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: AI_REQUIRE_INTERNAL_TOKEN
        value: "true"
      - key: MAX_AGENT_ITERATIONS
        value: "3"
      - key: MAX_TOOL_CALLS
        value: "8"
      - key: MAX_AGENT_RUNTIME_SECONDS
        value: "300"
      - key: WEB_SEARCH_MAX_RESULTS
        value: "3"
      - key: WEB_REQUEST_TIMEOUT
        value: "10"
      - key: WEB_MAX_CONTENT_LENGTH
        value: "200000"
      - key: WEB_MAX_EXTRACTED_CHARS
        value: "45000"
      # Must fit inside LOCAL_MODEL_CTX (~3 chars/token) with system prompt +
      # LLM_MAX_OUTPUT_TOKENS (the owned model uses this same process).
      # At ctx 2048: ~1024 tokens of prompt (~6000 chars) + 1024 answer tokens
      # + guard reserve = the full window. Bigger values are only for a larger
      # inference instance with a larger LOCAL_MODEL_CTX.
      - key: AGENT_MAX_CONTEXT_CHARS
        value: "6000"
      - key: LOCAL_MODEL_CTX
        value: "2048"

  # ---------------------------------------------------------------------------
  # 3) (removed) edunova-inference — the model is no longer a separate service.
  #    EduNova owns the complete AI stack: edunova-ai loads and serves the GGUF
  #    through its own supervised in-process runtime (inference/inprocess.py,
  #    llama-cpp-python as an internal library). A standalone debug server still
  #    exists at ai_engine/inference_server.py for local experimentation, but it
  #    is NOT part of the deployment topology and nothing communicates with it.
  #
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 4) edunova-signal — OPTIONAL standalone WebRTC signaling service.
  #    Disabled by default: server/server.js already provides Socket.IO
  #    signaling and chat on the API service. Uncomment ONLY if you want
  #    signaling isolated, and then point VITE_SIGNAL_URL at this service
  #    instead of the API service when building the frontend.
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: edunova-signal
  #   runtime: node
  #   plan: free
  #   rootDir: signaling
  #   buildCommand: npm ci --omit=dev
  #   startCommand: npm start
  #   healthCheckPath: /health
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "20.18.0"
  #     - key: CORS_ORIGIN
  #       value: https://edunova-x.ranjitacharya13.workers.dev
