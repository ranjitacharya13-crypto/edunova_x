name: Learning platform verification
on:
  push:
    branches: [main, 'arena/01a07641-edunova-x']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/edunova_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json}
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm audit --prefix server --audit-level=moderate
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failures, path: frontend/test-results, retention-days: 5}
  real-model-and-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF'
      LLM_PROVIDER: local
      LOCAL_MODEL_RUNTIME: llama_cpp
      LOCAL_MODEL_REPO: bartowski/Qwen2.5-0.5B-Instruct-GGUF
      LOCAL_MODEL_FILE: Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      LOCAL_MODEL_CTX_SIZE: '8192'
      LOCAL_MODEL_THREADS: '2'
      MODEL_STARTUP_TIMEOUT: '300'
      RAG_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: ai_engine/requirements.txt}
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ai_engine/requirements.txt pytest pytest-asyncio pytest-subtests
      - run: python ai_engine/verify_runtime.py
      - run: python -m pytest ai_engine/tests -q
      - name: Actual pretrained GGUF and PyTorch embedding inference (not a mock)
        run: python scripts/verify_real_model.py --output evidence/ci-real-inference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: real-inference-evidence, path: evidence, retention-days: 14}
