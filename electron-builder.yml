appId: com.edunova.x
productName: EduNova X
# Keep the runtime source accessible: bootstrap copies it to userData before npm install.
asar: false
npmRebuild: true
compression: maximum
files:
  - electron/**/*
  - package.json
  - package-lock.json
  - server/**/*
  - frontend/**/*
  - signaling/**/*
  - ai_engine/**/*
  - .env.example
  - README.md
  - '!**/node_modules/**'
  - '!**/dist/**'
  - '!**/.env'
  - '!**/.env.*'
directories:
  output: release
  buildResources: build
extraMetadata:
  main: electron/main.js
win:
  target:
    - nsis
  artifactName: EduNova-X-Setup-${version}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: EduNova X
  runAfterFinish: true
mac:
  target: dmg
  category: public.app-category.education
dmg:
  artifactName: EduNova-X-${version}.${ext}
linux:
  target: AppImage
